<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="モザイク">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>モザイク</title>
</head>
<body>
<main class="app">
<h1>モザイク</h1>
<p class="privacy">画像は端末内で処理され、外部へ送信しません。</p>
<label class="button primary">写真を選ぶ
<input id="fileInput" type="file" accept="image/*" hidden>
</label>
<section id="editor" class="hidden">
<div class="canvas-wrap"><canvas id="canvas"></canvas></div>
<label>ブラシサイズ<input id="brushSize" type="range" min="10" max="120" value="40"></label>
<label>モザイクの粗さ<input id="pixelSize" type="range" min="6" max="60" value="20"></label>
<div class="actions">
<button id="undoBtn" class="button">戻す</button>
<button id="clearBtn" class="button">全消去</button>
<button id="saveBtn" class="button primary">画像を保存</button>
</div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
